[package]
name = "rustwiki"
version = "0.1.0"
authors = ["Daniel Parks <dp+git@oxidized.org>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "1.0"
anyhow = "1"
htmlize = "0"
lazy_static = "1.4"
mustache = "0" # Look at ramhorns instead of mustache?
pulldown-cmark = { version = "0", default-features = false, features = ["simd"] } # enable simd only on 86_x64?
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.8"
simplelog = "0.7"
structopt = "0"
thiserror = "1.0"

# Bugs: https://github.com/rust-lang/regex/pull/628
#regex = "1"
regex = { git = "https://github.com/danielparks/regex.git", branch = "split_627_and_521" }

[dev-dependencies]
temp_testdir = "0.2"
