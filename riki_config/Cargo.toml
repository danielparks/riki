[package]
name = "riki_config"
version = "0.1.0"
authors = ["Daniel Parks <oss-riki@demonhorse.org>"]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[dependencies]
axum = "0.8.8"
bstr = "1.12.0"
codespan-reporting = "0.12.0"
derive_more = { version = "2.1.1", features = ["from"] }
globset = "0.4.18"
logos = "0.15.1"
ouroboros = "0.18.5"
pastey = "0.2.1"
termcolor = "1.4.1"
thiserror = "2.0.15"
tracing = "0.1.41"
riki_misc = { path = "../riki_misc" }
riki_actions = { path = "../riki_actions" }
riki_render = { path = "../riki_render" }

[build-dependencies]
lelwel = "0.9.1"

[dev-dependencies]
assert2 = "0.3.16"
temp-dir = "0.1.16"
test-log = { version = "0.2.19", default-features = false, features = ["color", "trace"] }

[lints]
workspace = true
