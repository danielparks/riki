[package]
name = "riki_actions"
version = "0.1.0"
authors = ["Daniel Parks <oss-riki@demonhorse.org>"]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[dependencies]
ambassador = "0.5.0"
anyhow = "1.0.95"
axum = "0.8.8"
base64 = "0.22.1"
derive_more = { version = "2.1.1", features = ["from", "display"] }
dom_query = "0.24.0"
handlebars = { version = "6.3.2", features = ["dir_source"] }
htmlize = "1.0.6"
http = "1.4.0"
jiff = { version = "0.2.15", features = ["serde"] }
maplit = "1.0.2"
mime = "0.3.17"
mime_guess = "2.0.5"
pulldown-cmark = "0.13.0"
read-doc = "0.1.0"
regex = "1.11.1"
riki_misc = { path = "../riki_misc" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml = "0.9.34"
strum = { version = "0.27.2", features = ["derive"] }
tendril = "0.4.3"
thiserror = "2.0.15"
tracing = "0.1.41"
url = "2.5.7"

[dev-dependencies]
assert2 = "0.3.16"
temp-dir = "0.1.16"
test-log = { version = "0.2.19", default-features = false, features = ["color", "trace"] }

[lints]
workspace = true
