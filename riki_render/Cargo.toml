[package]
name = "riki_render"
version = "0.1.0"
authors = ["Daniel Parks <oss-riki@demonhorse.org>"]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[dependencies]
handlebars = { version = "6.3.2", features = ["dir_source", "rust-embed"] }
serde_json = "1.0.143"
jiff = { version = "0.2.15", features = ["serde"] }
rust-embed = "8.7.2"
thiserror = "2.0.15"

[dev-dependencies]
test-log = { version = "0.2.19", default-features = false, features = ["color", "trace"] }

[lints]
workspace = true
